<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoFormX 宣传图生成器</title>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
      background: #1a1a2e;
      color: #fff;
      padding: 40px;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #f97316;
    }

    .section {
      margin-bottom: 60px;
    }

    .section-title {
      font-size: 18px;
      color: #94a3b8;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title span {
      background: #f97316;
      color: white;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 14px;
    }

    .export-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .export-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(249, 115, 22, 0.4);
    }

    .canvas-wrapper {
      display: inline-block;
      border: 2px dashed #475569;
      padding: 4px;
      border-radius: 8px;
    }

    /* ==================== 小型宣传图块 440x280 ==================== */
    .promo-small {
      width: 440px;
      height: 280px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .promo-small::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(249, 115, 22, 0.15) 0%, transparent 50%);
    }

    .promo-small::after {
      content: '';
      position: absolute;
      bottom: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 70%, rgba(20, 184, 166, 0.1) 0%, transparent 50%);
    }

    .promo-small .logo-section {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      z-index: 1;
    }

    .promo-small .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.4);
    }

    .promo-small .logo-text {
      font-size: 32px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -1px;
    }

    .promo-small .tagline {
      font-size: 18px;
      color: #94a3b8;
      z-index: 1;
      margin-bottom: 24px;
    }

    .promo-small .features {
      display: flex;
      gap: 20px;
      z-index: 1;
    }

    .promo-small .feature {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #64748b;
    }

    .promo-small .feature-dot {
      width: 6px;
      height: 6px;
      background: #f97316;
      border-radius: 50%;
    }

    /* ==================== 顶部宣传图块 1400x560 ==================== */
    .promo-large {
      width: 1400px;
      height: 560px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px 80px;
      position: relative;
      overflow: hidden;
    }

    .promo-large::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(249, 115, 22, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(20, 184, 166, 0.15) 0%, transparent 40%);
    }

    /* 装饰图案 */
    .promo-large .decoration {
      position: absolute;
      opacity: 0.1;
    }

    .promo-large .decoration-1 {
      top: 40px;
      right: 200px;
      width: 120px;
      height: 120px;
      border: 3px solid #f97316;
      border-radius: 24px;
      transform: rotate(15deg);
    }

    .promo-large .decoration-2 {
      bottom: 60px;
      left: 300px;
      width: 80px;
      height: 80px;
      border: 3px solid #14b8a6;
      border-radius: 50%;
    }

    .promo-large .decoration-3 {
      top: 150px;
      left: 150px;
      width: 40px;
      height: 40px;
      background: #f97316;
      border-radius: 8px;
      transform: rotate(45deg);
    }

    .promo-large .left-content {
      z-index: 1;
      max-width: 600px;
    }

    .promo-large .logo-section {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .promo-large .logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(249, 115, 22, 0.4);
    }

    .promo-large .logo-text {
      font-size: 48px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -2px;
    }

    .promo-large .main-tagline {
      font-size: 28px;
      color: #f8fafc;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .promo-large .sub-tagline {
      font-size: 18px;
      color: #94a3b8;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .promo-large .features {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .promo-large .feature-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-radius: 24px;
      font-size: 15px;
      color: #fb923c;
      font-weight: 500;
    }

    .promo-large .feature-tag svg {
      width: 18px;
      height: 18px;
    }

    .promo-large .right-content {
      z-index: 1;
      position: relative;
    }

    /* 模拟界面预览 */
    .promo-large .preview-card {
      width: 500px;
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .promo-large .preview-header {
      padding: 16px 20px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .promo-large .preview-dots {
      display: flex;
      gap: 8px;
    }

    .promo-large .preview-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .promo-large .preview-dot.red { background: #ef4444; }
    .promo-large .preview-dot.yellow { background: #eab308; }
    .promo-large .preview-dot.green { background: #22c55e; }

    .promo-large .preview-title {
      font-size: 14px;
      color: #64748b;
    }

    .promo-large .preview-body {
      padding: 24px;
    }

    .promo-large .preview-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .promo-large .preview-input {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .promo-large .preview-label {
      width: 60px;
      font-size: 13px;
      color: #94a3b8;
    }

    .promo-large .preview-field {
      flex: 1;
      height: 40px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 14px;
      color: #f8fafc;
    }

    .promo-large .preview-field.filled {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
    }

    .promo-large .preview-ai-btn {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .promo-large .author {
      position: absolute;
      bottom: 24px;
      right: 80px;
      font-size: 14px;
      color: #64748b;
      z-index: 1;
    }

    .promo-large .author span {
      color: #f97316;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>🎨 AutoFormX 宣传图生成器</h1>

  <!-- 小型宣传图块 -->
  <div class="section">
    <div class="section-title">
      <span>440 x 280</span>
      小型宣传图块
    </div>
    <div class="canvas-wrapper">
      <div class="promo-small" id="promo-small">
        <div class="logo-section">
          <div class="logo-icon">
            <svg width="32" height="32" viewBox="0 0 128 128" fill="none">
              <path d="M69 22L34 70h28l-4 36 35-48H65l4-36z" fill="white"/>
            </svg>
          </div>
          <div class="logo-text">AutoFormX</div>
        </div>
        <div class="tagline">AI 智能表单填写助手</div>
        <div class="features">
          <div class="feature">
            <div class="feature-dot"></div>
            <span>一键填写</span>
          </div>
          <div class="feature">
            <div class="feature-dot"></div>
            <span>智能识别</span>
          </div>
          <div class="feature">
            <div class="feature-dot"></div>
            <span>多家AI</span>
          </div>
        </div>
      </div>
    </div>
    <br>
    <button class="export-btn" onclick="exportImage('promo-small', 'AutoFormX-small-440x280.png')">
      📥 导出小型宣传图 (440x280)
    </button>
  </div>

  <!-- 顶部宣传图块 -->
  <div class="section">
    <div class="section-title">
      <span>1400 x 560</span>
      顶部宣传图块
    </div>
    <div class="canvas-wrapper" style="max-width: 100%; overflow-x: auto;">
      <div class="promo-large" id="promo-large">
        <!-- 装饰元素 -->
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="decoration decoration-3"></div>

        <div class="left-content">
          <div class="logo-section">
            <div class="logo-icon">
              <svg width="40" height="40" viewBox="0 0 128 128" fill="none">
                <path d="M69 22L34 70h28l-4 36 35-48H65l4-36z" fill="white"/>
              </svg>
            </div>
            <div class="logo-text">AutoFormX</div>
          </div>
          <div class="main-tagline">AI 驱动的智能表单填写助手</div>
          <div class="sub-tagline">使用人工智能技术自动识别表单字段，一键生成符合业务场景的测试数据，大幅提升开发测试效率</div>
          <div class="features">
            <div class="feature-tag">
              <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/></svg>
              一键智能填写
            </div>
            <div class="feature-tag">
              <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
              20+ 字段类型
            </div>
            <div class="feature-tag">
              <svg viewBox="0 0 20 20" fill="currentColor"><path d="M13 7H7v6h6V7z"/><path fill-rule="evenodd" d="M7 2a1 1 0 012 0v1h2V2a1 1 0 112 0v1h2a2 2 0 012 2v2h1a1 1 0 110 2h-1v2h1a1 1 0 110 2h-1v2a2 2 0 01-2 2h-2v1a1 1 0 11-2 0v-1H9v1a1 1 0 11-2 0v-1H5a2 2 0 01-2-2v-2H2a1 1 0 110-2h1V9H2a1 1 0 010-2h1V5a2 2 0 012-2h2V2zM5 5h10v10H5V5z" clip-rule="evenodd"/></svg>
              多家 AI 服务商
            </div>
            <div class="feature-tag">
              <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg>
              本地安全存储
            </div>
          </div>
        </div>

        <div class="right-content">
          <div class="preview-card">
            <div class="preview-header">
              <div class="preview-dots">
                <div class="preview-dot red"></div>
                <div class="preview-dot yellow"></div>
                <div class="preview-dot green"></div>
              </div>
              <div class="preview-title">用户注册表单</div>
            </div>
            <div class="preview-body">
              <div class="preview-form">
                <div class="preview-input">
                  <div class="preview-label">姓名</div>
                  <div class="preview-field filled">张小明</div>
                  <div class="preview-ai-btn">
                    <svg width="16" height="16" viewBox="0 0 128 128" fill="none">
                      <path d="M69 22L34 70h28l-4 36 35-48H65l4-36z" fill="white"/>
                    </svg>
                  </div>
                </div>
                <div class="preview-input">
                  <div class="preview-label">邮箱</div>
                  <div class="preview-field filled">zhangxm@example.com</div>
                  <div class="preview-ai-btn">
                    <svg width="16" height="16" viewBox="0 0 128 128" fill="none">
                      <path d="M69 22L34 70h28l-4 36 35-48H65l4-36z" fill="white"/>
                    </svg>
                  </div>
                </div>
                <div class="preview-input">
                  <div class="preview-label">手机号</div>
                  <div class="preview-field filled">138****8888</div>
                  <div class="preview-ai-btn">
                    <svg width="16" height="16" viewBox="0 0 128 128" fill="none">
                      <path d="M69 22L34 70h28l-4 36 35-48H65l4-36z" fill="white"/>
                    </svg>
                  </div>
                </div>
                <div class="preview-input">
                  <div class="preview-label">地址</div>
                  <div class="preview-field filled">北京市朝阳区...</div>
                  <div class="preview-ai-btn">
                    <svg width="16" height="16" viewBox="0 0 128 128" fill="none">
                      <path d="M69 22L34 70h28l-4 36 35-48H65l4-36z" fill="white"/>
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="author">Created by <span>Qi</span></div>
      </div>
    </div>
    <br>
    <button class="export-btn" onclick="exportImage('promo-large', 'AutoFormX-large-1400x560.png')">
      📥 导出顶部宣传图 (1400x560)
    </button>
  </div>

  <script>
    async function exportImage(elementId, filename) {
      const element = document.getElementById(elementId);
      
      try {
        const canvas = await html2canvas(element, {
          scale: 1, // 1:1 尺寸导出
          useCORS: true,
          backgroundColor: null,
          logging: false
        });

        // 转换为 PNG 并下载
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();

        alert('✅ 图片已导出：' + filename);
      } catch (error) {
        alert('❌ 导出失败：' + error.message);
        console.error(error);
      }
    }
  </script>
</body>
</html>
